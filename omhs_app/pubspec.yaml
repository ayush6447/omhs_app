name: omhs_app
description: OMHS v2 companion app - live measurement, history and device control.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.13
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  provider: ^6.1.2
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled (not fetched at runtime) so the app works offline in clinics.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
